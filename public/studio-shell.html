<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Inspector</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f110f}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f110f}.edit-launch{position:fixed;right:22px;bottom:22px;z-index:999999;padding:14px 18px;border:0;border-radius:999px;background:#bdd657;color:#10120f;font:700 12px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 40px rgba(0,0,0,.35);cursor:pointer}.edit-launch:hover{transform:translateY(-2px)}.edit-launch:active{transform:translateY(0)}</style></head><body><iframe id="studioFrame" src="/studio.html?v=20260922b" title="Studio portfolio"></iframe><button class="edit-launch" id="editLaunch">Edit site ⚙</button><script>const f=document.getElementById('studioFrame'),b=document.getElementById('editLaunch');function openEditor(){try{const d=f.contentDocument||f.contentWindow.document;const g=d.querySelector('.gear');if(g){g.click();return}const l=d.querySelector('.login');if(l){l.classList.add('open');return}}catch(e){}alert('Editor is still loading. Try again in a second.')}b.addEventListener('click',openEditor);window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();openEditor()}});</script></body></html>
